name: Refresh coin data

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch coin data
        run: node scripts/fetch-data.mjs --force
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Commit if the data changed
        run: |
          git config user.name "yte121"
          git config user.email "55489792+yte121@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No change." && exit 0
          git commit -m "Refresh coin data $(date -u +%F)"
          git push
